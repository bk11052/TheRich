[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # starlette 가 httpx2 로 넘어가는 중. 우리 코드 문제 아님.
    ignore:Using .httpx. with .starlette.testclient. is deprecated:
    # TimestampMixin 이 datetime.utcnow 사용. Python 3.12+ 에서 deprecated.
    # 타임존 인식 datetime 으로 옮기는 건 저장된 값 호환 확인이 필요해 별도 작업으로 분리.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
